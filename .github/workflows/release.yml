name: Release

# Triggered by a completed test run on main, not by a push. Tags v$version and
# publishes to crates.io when that version is not there yet, so merging a
# version bump to main is the release.

on:
  workflow_run:
    workflows: ["Test the package"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: GregorLueg/personal-actions/.github/workflows/rust-release.yml@v1
    secrets: inherit
